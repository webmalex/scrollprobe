name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.3.1

      - name: Run repository checks
        uses: pre-commit/action@v3.0.1

      - name: Run unit tests
        run: make test

      - name: Build ad-hoc release artifact
        run: make package

      - name: Verify app signature and metadata
        run: |
          codesign --verify --deep --strict --verbose=2 dist/ScrollProbe.app
          test "$(defaults read "$PWD/dist/ScrollProbe.app/Contents/Info" CFBundleIdentifier)" = \
            "io.github.webmalex.ScrollProbe"
