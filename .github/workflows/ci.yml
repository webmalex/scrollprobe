name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.3.1

      - name: Run repository checks
        uses: pre-commit/action@v3.0.1

      - name: Run unit tests
        run: make test

      - name: Build ad-hoc release artifact
        run: make verify-package

      - name: Locate release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: artifact
        shell: bash
        run: |
          archive_path="$(make --silent print-archive-path)"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "${archive_path%.zip}")" >> "$GITHUB_OUTPUT"

      - name: Attest release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.archive_path }}

      - name: Upload release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.archive_name }}
          path: |
            ${{ steps.artifact.outputs.archive_path }}
            ${{ steps.artifact.outputs.archive_path }}.sha256
          if-no-files-found: error
